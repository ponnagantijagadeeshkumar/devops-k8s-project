apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-k8s-app
  namespace: devops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-k8s-app

  template:
    metadata:
      labels:
        app: devops-k8s-app

    spec:
      containers:
        - name: devops-k8s-app
          image: devops-k8s-app:1.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: devops-k8s-config
                  key: APP_ENV

            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-k8s-secret
                  key: API_KEY

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"