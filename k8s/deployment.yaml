apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-k8s-app
  namespace: devops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-k8s-app

  template:
    metadata:
      labels:
        app: devops-k8s-app

    spec:
      containers:
        - name: devops-k8s-app
          image: devops-k8s-app:1.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000